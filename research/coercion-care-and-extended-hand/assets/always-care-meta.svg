<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Always has been — the care meta-meme</title>
<desc id="desc">Two astronauts look toward a planet held in an eye-shaped network. One offers an open glove. An infinity loop remains open between them. Wait… anarchism has always been about care? Always has been. A playful mutual-aid motif. Not a complete history. Creative motif, review draft.</desc>
<defs>
  <radialGradient id="space"><stop stop-color="#233644"/><stop offset="1" stop-color="#0b1322"/></radialGradient>
  <radialGradient id="planet" cx=".35" cy=".25"><stop stop-color="#94dad0"/><stop offset=".65" stop-color="#3d8b96"/><stop offset="1" stop-color="#1c4b66"/></radialGradient>
  <linearGradient id="visor" x2="1" y2="1"><stop stop-color="#38546a"/><stop offset="1" stop-color="#111a2b"/></linearGradient>
  <linearGradient id="threads"><stop stop-color="#79d3ca"/><stop offset="1" stop-color="#bc9cdd"/></linearGradient>
</defs>
<rect width="1600" height="1000" rx="30" fill="url(#space)"/>
<g fill="#d5e6ed" opacity=".55">
  <circle cx="98" cy="270" r="2"/><circle cx="149" cy="391" r="3"/><circle cx="284" cy="266" r="2"/><circle cx="411" cy="363" r="2"/><circle cx="1379" cy="286" r="3"/><circle cx="1490" cy="412" r="2"/><circle cx="1281" cy="369" r="2"/><circle cx="1470" cy="600" r="3"/><circle cx="107" cy="642" r="2"/><circle cx="342" cy="458" r="2"/><circle cx="1521" cy="228" r="2"/>
</g>
<g font-family="DejaVu Sans, sans-serif" fill="#f2f4ed">
  <text x="84" y="95" font-size="18" letter-spacing="5" fill="#92c9c8">ROOT SEQUENCE / EXTENDED HAND</text>
  <text x="84" y="170" font-size="42" font-weight="700">Wait… anarchism has always been about care?</text>
  <text x="1060" y="225" font-size="42" font-weight="700" fill="#eacfa1">Always has been.</text>
</g>
