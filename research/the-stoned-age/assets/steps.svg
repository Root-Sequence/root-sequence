<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Four separate questions: experience, interpretation, evidence and authority</title><rect width="800" height="360" fill="#f6f0df"/><rect x="35" y="40" width="160" height="70" fill="none" stroke="#326b5c" stroke-width="2"/><text x="47" y="68" fill="#182d30" font-family="sans-serif" font-size="14">EXPERIENCE</text><text x="47" y="92" fill="#182d30" font-family="sans-serif" font-size="12">What happened?</text><path d="M195 75 L225 135" fill="none" stroke="#bd461f" stroke-width="2"/><rect x="225" y="100" width="160" height="70" fill="none" stroke="#326b5c" stroke-width="2"/><text x="237" y="128" fill="#182d30" font-family="sans-serif" font-size="14">INTERPRETATION</text><text x="237" y="152" fill="#182d30" font-family="sans-serif" font-size="12">What does it mean?</text><path d="M385 135 L415 195" fill="none" stroke="#bd461f" stroke-width="2"/><rect x="415" y="160" width="160" height="70" fill="none" stroke="#326b5c" stroke-width="2"/><text x="427" y="188" fill="#182d30" font-family="sans-serif" font-size="14">EVIDENCE</text><text x="427" y="212" fill="#182d30" font-family="sans-serif" font-size="12">What supports it?</text><path d="M575 195 L605 255" fill="none" stroke="#bd461f" stroke-width="2"/><rect x="605" y="220" width="160" height="70" fill="none" stroke="#326b5c" stroke-width="2"/><text x="617" y="248" fill="#182d30" font-family="sans-serif" font-size="14">AUTHORITY</text><text x="617" y="272" fill="#182d30" font-family="sans-serif" font-size="12">Who may decide?</text><text x="35" y="325" fill="#182d30" font-family="sans-serif" font-size="18">THE CONNECTIONS REQUIRE JUSTIFICATION.</text></svg>