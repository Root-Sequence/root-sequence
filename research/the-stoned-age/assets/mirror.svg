<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Four repetitions of one claim do not make four independent witnesses</title><rect width="800" height="360" fill="#f6f0df"/><rect x="25" y="45" width="175" height="190" fill="none" stroke="#326b5c" stroke-width="2"/><text x="45" y="135" fill="#182d30" font-family="sans-serif" font-size="17">ONE CLAIM</text><rect x="220" y="60" width="175" height="190" fill="none" stroke="#326b5c" stroke-width="2"/><text x="240" y="150" fill="#182d30" font-family="sans-serif" font-size="17">ONE CLAIM</text><rect x="415" y="75" width="175" height="190" fill="none" stroke="#326b5c" stroke-width="2"/><text x="435" y="165" fill="#182d30" font-family="sans-serif" font-size="17">ONE CLAIM</text><rect x="610" y="90" width="175" height="190" fill="none" stroke="#326b5c" stroke-width="2"/><text x="630" y="180" fill="#182d30" font-family="sans-serif" font-size="17">ONE CLAIM</text><text x="25" y="320" fill="#bd461f" font-family="sans-serif" font-size="18">FOUR REFLECTIONS ARE NOT FOUR WITNESSES.</text></svg>