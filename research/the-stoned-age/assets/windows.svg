<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Four archaeological evidence types: shrine residues, braziers, ritual bundle and hair</title><rect width="800" height="360" fill="#f6f0df"/><rect x="25" y="45" width="175" height="205" fill="none" stroke="#326b5c" stroke-width="2"/><circle cx="113" cy="105" r="32" fill="none" stroke="#bd461f" stroke-width="2"/><text x="35" y="180" fill="#182d30" font-family="sans-serif" font-size="15">ARAD</text><text x="35" y="210" fill="#182d30" font-family="sans-serif" font-size="13">Shrine residues</text><rect x="220" y="45" width="175" height="205" fill="none" stroke="#326b5c" stroke-width="2"/><circle cx="308" cy="105" r="32" fill="none" stroke="#bd461f" stroke-width="2"/><text x="230" y="180" fill="#182d30" font-family="sans-serif" font-size="15">PAMIRS</text><text x="230" y="210" fill="#182d30" font-family="sans-serif" font-size="13">Funerary braziers</text><rect x="415" y="45" width="175" height="205" fill="none" stroke="#326b5c" stroke-width="2"/><circle cx="503" cy="105" r="32" fill="none" stroke="#bd461f" stroke-width="2"/><text x="425" y="180" fill="#182d30" font-family="sans-serif" font-size="15">SOUTH AMERICA</text><text x="425" y="210" fill="#182d30" font-family="sans-serif" font-size="13">Ritual bundle</text><rect x="610" y="45" width="175" height="205" fill="none" stroke="#326b5c" stroke-width="2"/><circle cx="698" cy="105" r="32" fill="none" stroke="#bd461f" stroke-width="2"/><text x="620" y="180" fill="#182d30" font-family="sans-serif" font-size="15">MENORCA</text><text x="620" y="210" fill="#182d30" font-family="sans-serif" font-size="13">Human hair</text><text x="25" y="300" fill="#182d30" font-family="sans-serif" font-size="18">FOUR WINDOWS. NO UNIVERSAL ORIGIN STORY.</text></svg>