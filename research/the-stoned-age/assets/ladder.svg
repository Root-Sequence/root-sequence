<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">An evidential ladder: exposure, effects, transmission and a better explanation; each step remains a question</title><rect width="800" height="360" fill="#f6f0df"/><path d="M90 285 L730 285" fill="none" stroke="#326b5c" stroke-width="2"/><text x="110" y="273" fill="#182d30" font-family="sans-serif" font-size="19">EXPOSURE</text><text x="750" y="285" fill="#bd461f" font-family="sans-serif" font-size="27">?</text><path d="M90 215 L730 215" fill="none" stroke="#326b5c" stroke-width="2"/><text x="110" y="203" fill="#182d30" font-family="sans-serif" font-size="19">EFFECTS</text><text x="750" y="215" fill="#bd461f" font-family="sans-serif" font-size="27">?</text><path d="M90 145 L730 145" fill="none" stroke="#326b5c" stroke-width="2"/><text x="110" y="133" fill="#182d30" font-family="sans-serif" font-size="19">TRANSMISSION</text><text x="750" y="145" fill="#bd461f" font-family="sans-serif" font-size="27">?</text><path d="M90 75 L730 75" fill="none" stroke="#326b5c" stroke-width="2"/><text x="110" y="63" fill="#182d30" font-family="sans-serif" font-size="19">BETTER EXPLANATION</text><text x="750" y="75" fill="#bd461f" font-family="sans-serif" font-size="27">?</text><path d="M90 35 L90 310" fill="none" stroke="#182d30" stroke-width="2"/><path d="M730 35 L730 310" fill="none" stroke="#182d30" stroke-width="2"/></svg>