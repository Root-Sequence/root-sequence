<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title"><title id="title">Overlapping circles distinguish experience and consent</title><rect width="800" height="360" fill="#f6f0df"/><circle cx="280" cy="175" r="130" fill="none" stroke="#326b5c" stroke-width="2"/><circle cx="520" cy="175" r="130" fill="none" stroke="#bd461f" stroke-width="2"/><text x="185" y="165" fill="#182d30" font-family="sans-serif" font-size="20">EXPERIENCE</text><text x="470" y="195" fill="#182d30" font-family="sans-serif" font-size="20">CONSENT</text><text x="30" y="330" fill="#182d30" font-family="sans-serif" font-size="18">SIGNIFICANCE DOES NOT CANCEL REFUSAL.</text></svg>