name: Idea Trail browser

on:
  push:
    branches: [main]
    paths:
      - IDEA_TRAIL_GRAPH.yml
      - IDEA_TRAIL_METADATA.md
      - cli/generate_idea_trail_index.py
      - .github/workflows/idea-trails.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Generate browser
        run: python cli/generate_idea_trail_index.py

      - name: Validate graph and generated output
        run: python cli/generate_idea_trail_index.py --check

      - name: Commit generated browser when changed
        shell: bash
        run: |
          if git diff --quiet -- IDEA_TRAIL_INDEX.md; then
            echo "Idea Trail browser is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IDEA_TRAIL_INDEX.md
          git commit -m "Update generated Idea Trail browser [skip ci]"
          git push
