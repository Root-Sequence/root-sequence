name: Deploy Root Sequence website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify the site
        run: python site/test_site.py

      - name: Show publication digests
        run: |
          echo "source_sha256=$(python site/build.py --digest)"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          print("approved_preview_sha256=" + sha256(Path("site/index.html").read_bytes()).hexdigest())
          PY

      - name: Build the approved release
        run: python site/build.py --release --output site/dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the exact generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
